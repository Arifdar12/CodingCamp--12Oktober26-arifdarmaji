<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <noscript>Application could not start. Please enable JavaScript.</noscript>

  <!-- ===== GREETING SECTION ===== -->
  <header class="greeting-section">
    <div class="greeting-text">
      <h1 id="greeting-msg">Good Morning! 👋</h1>
      <p id="datetime-display"></p>
    </div>
  </header>

  <!-- STORAGE WARNING BANNER -->
  <div id="storage-warning" style="display:none;" role="alert">
    ⚠️ Local storage is unavailable. Your data will not be saved this session.
  </div>

  <!-- ===== MAIN DASHBOARD GRID ===== -->
  <main class="dashboard">

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-buttons">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-secondary" id="timer-stop">Stop</button>
        <button class="btn btn-ghost" id="timer-reset">Reset</button>
      </div>
      <p class="timer-label" id="timer-label">Ready to focus?</p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>
      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="input-field"
          placeholder="Add a new task..."
          maxlength="200"
        />
        <button class="btn btn-primary" id="todo-add">Add</button>
      </div>
      <p id="todo-error" class="todo-error" style="display:none;"></p>
      <ul class="todo-list" id="todo-list"></ul>
      <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>
      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="input-field"
          placeholder="Label (e.g. GitHub)"
          maxlength="30"
        />
        <input
          type="url"
          id="link-url-input"
          class="input-field"
          placeholder="https://..."
          maxlength="200"
        />
        <button class="btn btn-primary" id="link-add">Add</button>
      </div>
      <div class="links-grid" id="links-grid"></div>
      <p class="todo-empty" id="links-empty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- EDIT TASK MODAL -->
  <div class="modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="edit-input" class="input-field" maxlength="120" />
      <div class="modal-buttons">
        <button class="btn btn-primary" id="edit-save">Save</button>
        <button class="btn btn-ghost" id="edit-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
